repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt-gate
        name: gofmt (src/ingestion/gate)
        entry: >-
          bash -c 'out=$(gofmt -l src/ingestion/gate); if [ -n "$out" ]; then
          echo "gofmt: files not formatted"; echo "$out"; exit 1; fi'
        language: system
        pass_filenames: false
        files: ^src/ingestion/gate/.*\.go$
