name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install -r requirements.txt
      - run: cd src/gate && go build ./...
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/ -v --ignore=tests/test_e2e.py

  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install -r requirements.txt
      - run: cd src/gate && go build ./...
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/test_e2e.py -v -s
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            benchmarks/quality-report.json
            docs/quality-report.md
